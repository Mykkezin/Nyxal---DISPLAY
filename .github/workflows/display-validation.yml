name: Nyxal Display — lint e build

on:
  push:
    branches:
      - main
      - feat/jarvis-hud-visual-refresh
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: TypeScript / lint
        run: npm run lint
      - name: Build de produção
        run: npm run build
